<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospero — Delegue o resultado, não a tarefa</title>
    <style>
      /* ===== tokens ===== */
      :root {
        --bg: #fbf6ec;
        --surface: #ffffff;
        --surface-2: #fffaf2;
        --ink: #2a2521;
        --ink-soft: #7a7066;
        --ink-faint: #a89e90;
        --accent: #ff5e3a;
        --accent-dark: #d2401d;
        --accent-soft: #ffe7df;
        --line: #f0e4d6;
        --shadow-sm: 0 6px 18px rgba(42, 37, 33, 0.07);
        --shadow-lg: 0 18px 44px rgba(42, 37, 33, 0.12);
        --wrap: 1120px;
      }

      /* ===== reset ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent);
        color: #fff;
      }

      /* ===== typography ===== */
      h1,
      h2,
      h3 {
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: clamp(2.4rem, 6vw, 4rem);
      }
      h2 {
        font-size: clamp(1.6rem, 3.6vw, 2.5rem);
      }
      h3 {
        font-size: 1.15rem;
      }
      p {
        font-size: 1.0625rem;
      }
      .kicker {
        font-size: 0.8125rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: var(--accent-dark);
        text-transform: uppercase;
      }
      .lede {
        font-size: clamp(1.0625rem, 1.6vw, 1.25rem);
        color: var(--ink-soft);
      }

      /* ===== layout shell ===== */
      .section {
        padding: clamp(56px, 9vw, 120px) 24px;
      }
      .wrap {
        max-width: var(--wrap);
        margin: 0 auto;
      }
      .section-head {
        max-width: 720px;
        margin-bottom: 40px;
      }
      .section-head h2 {
        margin: 10px 0 12px;
      }

      /* ===== buttons ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: inherit;
        font-weight: 700;
        font-size: 1rem;
        padding: 13px 24px;
        border-radius: 22px;
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          background 140ms ease;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 20px rgba(255, 94, 58, 0.32);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
      }
      .btn-ghost {
        background: transparent;
        color: var(--accent-dark);
        border-color: var(--line);
      }
      .link {
        color: var(--accent-dark);
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1.5px solid var(--accent-soft);
      }

      /* ===== scroll-reveal infra ===== */
      .reveal {
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 620ms ease,
          transform 620ms ease;
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }
      .reveal[data-delay="1"] {
        transition-delay: 90ms;
      }
      .reveal[data-delay="2"] {
        transition-delay: 180ms;
      }
      .reveal[data-delay="3"] {
        transition-delay: 270ms;
      }

      /* ===== reduced motion ===== */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== per-section CSS is appended below by later tasks ===== */
    </style>
  </head>
  <body>
    <main>
      <!-- sections inserted here by Tasks 2–9 -->
    </main>

    <script>
      (function () {
        "use strict";

        /* shared flags + constants */
        var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // CTA final: se vazio, o botão rola ao topo. Defina uma URL para
        // transformar o botão num link externo (site, contato).
        var LINKS = { cta: "" };

        // Slider de custo (S5): valores ILUSTRATIVOS — ordem de grandeza,
        // não preço real. Edite à vontade.
        var COST = { perAgent: 150, perHuman: 6000 };

        /* scroll-reveal: adds .in when a .reveal element enters the viewport */
        function scrollReveal() {
          var els = document.querySelectorAll(".reveal");
          if (REDUCED || !("IntersectionObserver" in window)) {
            els.forEach(function (el) {
              el.classList.add("in");
            });
            return;
          }
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (e) {
                if (e.isIntersecting) {
                  e.target.classList.add("in");
                  io.unobserve(e.target);
                }
              });
            },
            { threshold: 0.16 },
          );
          els.forEach(function (el) {
            io.observe(el);
          });
        }

        /* counters: animates [data-count] from 0 to its numeric value on reveal */
        function counters() {
          var els = document.querySelectorAll("[data-count]");
          els.forEach(function (el) {
            var target = parseFloat(el.getAttribute("data-count"));
            var suffix = el.getAttribute("data-suffix") || "";
            if (REDUCED || isNaN(target)) {
              el.textContent = (isNaN(target) ? el.textContent : target) + suffix;
              return;
            }
            var io = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) {
                if (!e.isIntersecting) return;
                io.unobserve(el);
                var start = null;
                function tick(ts) {
                  if (start === null) start = ts;
                  var p = Math.min((ts - start) / 1100, 1);
                  el.textContent = Math.round(target * p) + suffix;
                  if (p < 1) requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
              });
            });
            io.observe(el);
          });
        }

        /* interactive modules are appended here by Tasks 4, 5, 7, 8 */

        function init() {
          try {
            scrollReveal();
          } catch (e) {
            console.warn("scrollReveal failed", e);
          }
          try {
            counters();
          } catch (e) {
            console.warn("counters failed", e);
          }
          /* interactive init() calls are added here by later tasks */
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
