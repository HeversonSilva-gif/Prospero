name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit version: pnpm/action-setup reads packageManager
      # (pnpm@9.12.0) from package.json. Specifying both errored with
      # "Multiple versions of pnpm specified" when they drifted (9 vs 9.12.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm audit --prod --audit-level=high
        continue-on-error: false
