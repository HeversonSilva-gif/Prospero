name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runs lint + typecheck + test + build on all three target platforms.
  # TypeScript and Vite are platform-agnostic, but better-sqlite3 compiles a
  # native .node for the host ABI — so we validate the native build on each
  # platform to catch toolchain issues before a release attempt.
  #
  # Note: the CI jobs use `rebuild:node` (Node.js ABI) not `rebuild:electron`
  # (Electron ABI) — that's intentional. The `pretest` script already calls
  # `rebuild:node`; full Electron ABI rebuild only happens in the release
  # workflow where electron-builder is the consumer.
  build:
    name: CI · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # let all three platforms report; don't cancel on first failure
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No explicit version: pnpm/action-setup reads packageManager
      # (pnpm@9.12.0) from package.json. Specifying both errored with
      # "Multiple versions of pnpm specified" when they drifted (9 vs 9.12.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm audit --prod --audit-level=high
        continue-on-error: false
