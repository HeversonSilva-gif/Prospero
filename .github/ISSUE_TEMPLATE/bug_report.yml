name: Bug report
description: Something isn't working as expected.
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Before submitting**, please search existing issues to avoid duplicates.
        **Privacy reminder**: redact file paths, project names, API keys and conversation content from any logs or screenshots.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, the app does Y instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reliably trigger the bug.
      placeholder: |
        1. Open Prospero
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Fill in the relevant fields."
      value: |
        - Prospero version:
        - OS: Windows 11 / macOS / Linux
        - Node.js version (`node -v`):
        - pnpm version (`pnpm -v`):
        - Claude provider: Claude Max OAuth / Anthropic API key / Remote Docker
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: "Paste any relevant log output here. Redact private data before pasting."
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I redacted any sensitive paths, keys, or conversation content.
          required: true
