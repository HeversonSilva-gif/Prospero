name: Feature request
description: Suggest a new feature or improvement to Prospero.
title: "feat: <short description>"
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Prospero!
        Please search existing issues and discussions before opening a new request.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the pain point or job-to-be-done.
      placeholder: "As a solo founder, I find it hard to... because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or considered.

  - type: dropdown
    id: scope
    attributes:
      label: Area of Prospero affected
      multiple: true
      options:
        - Agent system (skills, tools, delegation)
        - Chat / UI
        - Electron shell / installer
        - CI / developer experience
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to related issues or discussions.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions and this is not a duplicate.
          required: true
