title = "Dashboard Agent gitleaks rules"

[extend]
useDefault = true

[[rules]]
id = "claude-oauth-token"
description = "Claude Code OAuth token"
regex = '''sk-ant-oat[A-Za-z0-9_-]{20,}'''
tags = ["secret", "anthropic"]

[[rules]]
id = "claude-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api03-[A-Za-z0-9_-]{50,}'''
tags = ["secret", "anthropic"]

[allowlist]
description = "Allow placeholder strings in tests and docs"
regexes = [
  '''sk-ant-(api|oat)0?3?-(EXAMPLE|PLACEHOLDER)[A-Z_-]*''',
  '''sk-ant-(api|oat)0?3?-FAKE[A-Z_-]*''',
  '''sk-ant-(api|oat)0?3?-PRODUCTION[_-][A-Z_-]*[a-z0-9]+''',
  '''sk-ant-api03-A{50,}''',
]
paths = [
  '''pnpm-lock\.yaml''',
  '''docs/superpowers/specs/.*\.md''',
  '''docs/superpowers/plans/.*\.md''',
]
