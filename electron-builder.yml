appId: com.prospero.app
productName: Prospero
copyright: Copyright © 2026 Heverson Silva

# The main entry (apps/main/dist/index.js) is an ES module (tsup builds ESM).
# Electron picks require() vs import() for the entry based on the APP-ROOT
# package.json "type" field. The repo root is CommonJS, so the packaged app
# would require() an ESM file and crash (ERR_REQUIRE_ESM). Inject type:module
# into the PACKAGED package.json only — dev is unaffected (it runs from
# apps/main, which already declares type:module).
extraMetadata:
  type: module

directories:
  output: release
  buildResources: build

# Single-package monorepo: root package.json is the app manifest.
# tsup outputs are in apps/main/dist and apps/renderer/dist.
asar: true

# better-sqlite3 ships a .node native binary that cannot be require()'d from
# inside an asar archive — Electron's asar shim only patches fs reads, not
# native module loading. We unpack it (and any other native dep) to
# app.asar.unpacked/, which is on disk next to app.asar.
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/bindings/**/*"
  - "**/node_modules/file-uri-to-path/**/*"
  # The MCP dashboard server is spawned by claude as a separate node process
  # (ELECTRON_RUN_AS_NODE). Node's ESM loader can't read a module from inside an
  # asar, so the server must live on disk — unpack it. apps/main/package.json
  # ("type": "module") rides along so the ESM loader treats server.js as ESM.
  - "apps/main/dist/mcp/**"
  - "apps/main/package.json"

files:
  # Compiled main process + preload + MCP server (tsup output)
  - "apps/main/dist/**/*"
  - "apps/main/package.json"
  # Compiled renderer bundle (vite output)
  - "apps/renderer/dist/**/*"
  - "apps/renderer/package.json"
  # Root manifest is needed for productName + version + main
  - "package.json"
  # Exclude TS sources, sourcemaps, tests, dev-only files everywhere
  - "!**/*.{ts,tsx,map}"
  - "!**/{tsconfig,tsconfig.*,vite.config,vitest.config,tsup.config,postcss.config,tailwind.config}.*"
  - "!**/{__tests__,tests,test,__snapshots__}/**"
  - "!**/*.test.*"
  - "!**/.eslintrc*"

# Windows x64 desktop installer. Linux AppImage/deb target is defined below
# for VPS deployment (see infra/docker/vps/README.md). macOS is not built.
win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  shortcutName: Prospero
  artifactName: "${productName}-Setup-${version}.${ext}"

# Linux target (added for VPS deployment — see infra/docker/vps/README.md).
# AppImage is the primary format (self-contained, portable, runs inside our
# noVNC container with --no-sandbox). .deb is built alongside for users who
# prefer system-package install on a Debian/Ubuntu host.
#
# The Windows target above is unaffected. Build Windows with `pnpm dist:win`
# and Linux with `pnpm dist:linux` (the latter must run on a Linux host or
# Linux-in-Docker — better-sqlite3's native ABI is host-specific).
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  synopsis: "Local orchestrator for Claude Code agents"
  description: "Prospero runs a hierarchy of Claude Code agents on your machine. See https://github.com/HeversonSilva-gif/Prospero."
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # AppImage runs inside the VPS container with --no-sandbox (the container has
  # no CAP_SYS_ADMIN and no setuid helper). This is a deliberate tradeoff
  # documented in SECURITY.md → "VPS Deployment Threat Model".

appImage:
  # No license popup, no integration menu — just run.
  license: LICENSE

# GitHub Releases is the distribution channel. electron-builder uploads the
# installer + latest.yml here when invoked with `--publish always` (the CI
# release workflow). Local `dist:win` has no `--publish`, so it only writes to
# ./release/ and never uploads.
publish:
  - provider: github
    owner: HeversonSilva-gif
    repo: Prospero
    # Publish as a real release, not a draft. electron-builder defaults to draft,
    # but electron-updater (unauthenticated) only sees published releases — a
    # draft leaves the installed app unable to find latest.yml ("error checking").
    releaseType: release
